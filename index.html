<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מי לחץ ראשון?</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1b1d29;--muted:#6b7084;--accent:#4f46e5;--accent2:#22c55e;--line:#e4e6ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12131a;--card:#1c1e29;--text:#eef0f8;--muted:#9a9fb5;--line:#2c2f3f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12131a;--card:#1c1e29;--text:#eef0f8;--muted:#9a9fb5;--line:#2c2f3f;color-scheme:dark}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px 16px 32px}
h1{margin:8px 0 0;font-size:1.5rem}
.sub{color:var(--muted);font-size:.95rem;margin:0;text-align:center}
#nameRow{display:flex;gap:8px}
input{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:1rem;width:180px}
#circle{width:min(62vw,260px);height:min(62vw,260px);border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:1.5rem;font-weight:700;cursor:pointer;box-shadow:0 10px 30px rgba(79,70,229,.4);transition:transform .08s,background .2s}
#circle:active{transform:scale(.95)}
#circle.done{background:var(--accent2);box-shadow:0 10px 30px rgba(34,197,94,.4)}
#circle:disabled{cursor:default}
#status{min-height:1.4em;color:var(--muted);text-align:center}
#results{width:min(100%,420px);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 16px}
#results h2{font-size:1.1rem;margin:12px 0 4px}
ol{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:none}
.rank{width:30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:700;font-size:.9rem;flex:none}
li:first-child .rank{background:#f5b301;color:#222}
.nm{flex:1;font-weight:600}
.dt{color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr}
.me .nm::after{content:" (אתה)";color:var(--muted);font-weight:400}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1>מי לחץ ראשון? ⚡</h1>
<p class="sub">כולם לוחצים על העיגול. כעבור 7 שניות מהלחיצה הראשונה תוצג הרשימה לכולם.</p>
<div id="nameRow"><input id="name" maxlength="20" placeholder="השם שלך"></div>
<button id="circle" disabled>לחץ!</button>
<div id="status">מתחבר…</div>
<div id="results" hidden><h2>תוצאות</h2><ol id="list"></ol></div>

<script>
const WINDOW = 7000;
let db = null, uid = null, clicks = [], myClickT = 0;
const $ = id => document.getElementById(id);
const nameEl = $('name'), circle = $('circle'), statusEl = $('status');

try { nameEl.value = localStorage.getItem('cr_name') || ''; } catch (e) {}
nameEl.addEventListener('input', () => { try { localStorage.setItem('cr_name', nameEl.value); } catch (e) {} });

// Split clicks into rounds: a round starts at its first click and lasts WINDOW ms.
function currentRound() {
  const s = [...clicks].sort((a, b) => a.t - b.t || (a.id < b.id ? -1 : 1));
  if (!s.length) return null;
  let start = s[0].t, group = [];
  for (const c of s) {
    if (c.t - start > WINDOW) { start = c.t; group = []; }
    group.push(c);
  }
  return { start, end: start + WINDOW, items: group };
}

function render() {
  const r = currentRound(), now = Date.now();
  const active = r && now < r.end;
  const showResults = r && now >= r.end;
  const mine = r && r.items.some(c => c.id === uid);

  circle.disabled = !db || !uid || (active && mine);
  circle.classList.toggle('done', !!(active && mine));
  circle.textContent = active && mine ? 'נשלח ✓' : 'לחץ!';

  if (!db) statusEl.textContent = 'לא ניתן להתחבר למערכת (נדרשת כניסה).';
  else if (active) statusEl.textContent = `הסיבוב פעיל… התוצאות בעוד ${Math.ceil((r.end - now) / 1000)} שנ׳ (${r.items.length} לחצו)`;
  else if (showResults) statusEl.textContent = 'הסיבוב הסתיים. לחצו שוב להתחיל סיבוב חדש.';
  else statusEl.textContent = 'ממתין ללחיצה ראשונה…';

  $('results').hidden = !showResults;
  if (showResults) {
    $('list').innerHTML = '';
    r.items.forEach((c, i) => {
      const li = document.createElement('li');
      if (c.id === uid) li.className = 'me';
      const rank = document.createElement('span'); rank.className = 'rank'; rank.textContent = i + 1;
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = c.name || 'אנונימי';
      const dt = document.createElement('span'); dt.className = 'dt';
      dt.textContent = i === 0 ? '0.000s' : '+' + ((c.t - r.start) / 1000).toFixed(3) + 's';
      li.append(rank, nm, dt);
      $('list').appendChild(li);
    });
  }
}

circle.addEventListener('click', async () => {
  if (!db || !uid) return;
  const t = Date.now();
  try {
    await db.collection('clicks').doc(uid).set({ t, name: nameEl.value.trim() || 'אנונימי' });
  } catch (e) { statusEl.textContent = 'שגיאה בשליחת הלחיצה: ' + (e && e.message || e); }
});

(async () => {
  try {
    const user = await claude.use('user');
    db = await claude.use('db');
    if (user) uid = await user.id();
    if (db) {
      db.collection('clicks').onSnapshot(snap => {
        clicks = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(c => typeof c.t === 'number');
        render();
      }, e => { statusEl.textContent = 'שגיאת חיבור: ' + (e && e.message || e); });
    }
  } catch (e) { db = null; }
  render();
})();
setInterval(render, 250);
render();
</script>
</body>
</html>
